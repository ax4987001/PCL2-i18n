name: Build PCL2-i18n

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build PCL2
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Update if specific .NET SDK version is required

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Get Git Hash
      id: vars
      shell: bash
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Inject Commit Hash
      run: |
        (Get-Content "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ steps.vars.outputs.sha_short }}"' | Set-Content "Plain Craft Launcher 2\Modules\Base\ModBase.vb"

    - name: Build Solution
      run: dotnet build "Plain Craft Launcher 2.sln" -c Release -m:1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL2-i18n-Release-${{ steps.vars.outputs.sha_short }}
        path: build/Plain Craft Launcher 2.exe
