name: Build PCL2-i18n

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build PCL2
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup VB.NET environment
      run: |
        dotnet workload install maui-desktop || echo "Skipping maui"
        dotnet workload install desktop || echo "Skipping desktop"

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore dependencies
      run: |
        nuget restore "Plain Craft Launcher 2.sln"
        dotnet restore PCLCS\PCLCS.csproj
        dotnet restore "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj"

    - name: Build Solution
      run: dotnet build "Plain Craft Launcher 2.sln" -c Release -p:Platform="Any CPU"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL2-i18n-Release
        path: build/Plain Craft Launcher 2.exe
