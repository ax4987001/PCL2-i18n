name: Build PCL2-i18n

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build PCL2
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Ensure VisualBasic is available
      run: |
        dotnet add "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" package Microsoft.VisualBasic -v 10.3.0 || echo "Package exists or failed"

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Restore dependencies
      run: |
        nuget restore "Plain Craft Launcher 2.sln"
        dotnet restore PCLCS\PCLCS.csproj
        dotnet restore "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj"

    - name: Build Solution
      run: dotnet build "Plain Craft Launcher 2.sln" -c Release -p:Platform="Any CPU"

    - name: Get Tag Name
      id: get_tag
      shell: bash
      run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Compress to ZIP
      shell: powershell
      run: Compress-Archive -Path "build\Plain Craft Launcher 2.exe" -DestinationPath "build\PCL2-i18n.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.get_tag.outputs.tag_name }}
        tag_name: ${{ steps.get_tag.outputs.tag_name }}
        draft: false
        prerelease: false
        files: build/PCL2-i18n.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
