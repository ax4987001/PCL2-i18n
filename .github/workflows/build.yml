name: Build PCL2-i18n

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build PCL2
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          4.8.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Restore dependencies
      run: |
        nuget restore "Plain Craft Launcher 2.sln"
        dotnet restore "Plain Craft Launcher 2.sln"

    - name: Build Solution
      run: msbuild "Plain Craft Launcher 2.sln" /p:Configuration=Release /p:Platform="Any CPU" /m:1

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL2-i18n-Release
        path: build/Plain Craft Launcher 2.exe
